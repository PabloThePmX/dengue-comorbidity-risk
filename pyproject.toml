[project]
name = "dengue-comorbidity-risk"
version = "0.1.0"
description = "Risco de desfecho grave em dengue por perfil de comorbidades (SINAN/DataSUS)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyreaddbc>=2.0.4",
    "dbfread>=2.0.7",
    "pandas>=2.2",
    "pyarrow>=11",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
    "catboost>=1.2.10",
    "optuna>=5.0.0",
    "mlflow>=3.18.0",
    "shap>=0.54.1",
    "pyyaml>=6.0.3",
    "matplotlib>=3.11.2",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
    "nbconvert>=7",
    "nbformat>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengue_sinan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["profiling/01_profiling.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
