# Manifesto da comparação em 2025 (D-97, R1/R2 1.5). Commitado ANTES de qualquer leitura de 2025:
# declara o conjunto fechado de modelos, o artefato de cada um (SHA-256), os anos de treino e o
# limiar próprio. Resultado de 2025 não escolhe, ajusta nem substitui modelo (R1).
# Modelo acrescentado depois do lacre é exploratório e declarado assim no relatório.
versao: 1
declarado_em: "2026-11-24"
ano_comparacao: 2025            # deve ser igual a `ano_comparacao` de config/base.yaml

comparacao:
  metricas_sem_limiar: [pr_auc, roc_auc, brier, calibration_slope, obs_esp, beneficio_liquido]
  orcamentos_de_alertas: [0.05, 0.10, 0.14]   # recall e precisão entre os X% casos de maior risco
  bootstrap: 1000                              # reamostras pareadas, semente única do config (R8)

saidas:
  previsoes_por_caso: data/comparacao       # linha a linha: fora do git (R7)
  agregados: reports/comparacao             # só agregados e gráficos (células < 10 suprimidas)
  lacre: reports/comparacao/LACRE.json

# Conferido na carga, para todos, e reportado na tabela (não exclui ninguém, D-97 f):
verificacoes_na_carga:
  - sha256 do artefato igual ao declarado, antes de carregar
  - variáveis do modelo contidas no dicionário de features do projeto (R4)
  - anos de treino dos metadados sem 2025 e sem o ano de comparação
  - sem correção de desbalanceamento (R3) nos parâmetros do modelo
  - carga somente em worktree e ambiente isolados (joblib executa código ao carregar)

modelos:
  # --- Projeto (main) ---
  - id: m1_main
    papel: modelo preditivo do projeto (XGBoost, M1)
    origem: {branch: main, commit: "91425adf9a3c2a614cecc10650a2f75678aeb9b0"}
    artefato: {caminho: "models/m1_final/payload/m1.joblib", fora_do_git: true,
               sha256: "394c0f19e9384dc41e4e13b872a29ac8b8fb9de1d0f0413ba5c72321d0e9901a"}
    treino_anos: [2022, 2023]
    variaveis: "dicionário de features do projeto (R4)"
    limiar: {valor: 0.0021548546241191616, regra: "recall >= B2 nas predições fora da dobra (D-92)"}
  - id: e1_main
    papel: modelo explicativo do projeto (logística com interações, E1)
    origem: {branch: main, commit: "91425adf9a3c2a614cecc10650a2f75678aeb9b0"}
    artefato: {caminho: "models/e1/payload/e1.npz",
               sha256: "7d669a7f2faba9d28c5974c0095d6ae8ef790400a3af6fa29c8c5b142c289ebc"}
    treino_anos: [2022, 2023]
    limiar: null                  # inferência: só métricas de probabilidade
  - id: b1_main
    papel: baseline B1 (logística simples)
    origem: {branch: main, commit: "91425adf9a3c2a614cecc10650a2f75678aeb9b0"}
    artefato: {caminho: "models/b1_final/payload/b1.joblib", fora_do_git: true,
               sha256: "9271ca6f2d4c45134ce6a2a5292878d7a989d0cc35293cda195c0a65ea6e6504"}
    treino_anos: [2022, 2023]
    limiar: {valor: 0.001140, regra: "recall >= B2 nas predições brutas fora da dobra"}
  - id: b0_main
    papel: baseline B0 (prevalência)
    origem: {branch: main, commit: "91425adf9a3c2a614cecc10650a2f75678aeb9b0"}
    artefato: {caminho: "models/b0_final/payload/b0.json", fora_do_git: true,
               sha256: "b6e4ad9c92adfc63561d69fff52e3a25eaf62eb21fe83a26ec13edfa94b32ee3"}
    treino_anos: [2022, 2023]
    limiar: {valor: 0.001529, regra: "recall >= B2 (marca todos os casos)"}
  - id: b2_regra
    papel: regra do protocolo do Ministério (grupo B, B2); não treina
    origem: {branch: main}
    artefato: null
    treino_anos: []
    limiar: null

  # --- Outras branches (modelos externos, carga isolada) ---
  - id: m1_soneca
    papel: XGBoost com calibrador isotônico (feat/soneca)
    origem: {branch: feat/soneca, commit: "2cdf4b3a5cde007bd0ec1409372f1e1c55de1705"}
    artefato: {caminho: "reports/modelo_risco_dengue/artefatos/m1_congelado.joblib",
               sha256: "6286d444d050279727db1ba2b7de4960114dddbf47a41d6075749ab4d9fbfde6"}
    treino_anos: [2022, 2023]     # metadados: assinatura_dados_dev
    variaveis: "a conferir na carga (objeto['variaveis'] do artefato)"
    limiar: {valor: 0.02582795250989377, regra: "F2 máximo, declarado pela branch (resultados.json)"}
    limiar_informativo: {valor: 0.0023752969121140144, regra: "recall >= B2 (limiar_sens_b2 da branch)"}
    ambiente_de_origem: {python: "3.12.10", pandas: "3.1.1", scikit_learn: "1.9.1", xgboost: "3.4.1"}
  - id: m1_lora
    papel: elastic net (feat/lora, vencedor por desempate técnico)
    origem: {branch: feat/lora, commit: "af96e97b01d6c21700229d833c5e0a6e0f656f11"}
    artefato: {caminho: "models/m1_final.joblib",
               sha256: "2f65a1ccf183d5f79bbac5eab6062906033f502c044562bd5c3be9bcc6371ce2"}
    treino_anos: [2022, 2023]     # config/base.yaml da branch (anos_dev)
    variaveis: "M1_FEATURES de preprocess.py da branch; a conferir na carga"
    limiar: {valor: 0.0230, regra: "F2 máximo (reports/teste/metricas.md da branch)"}

fora_do_conjunto:
  - id: m1_ricardo
    motivo: "feat/ricardo só tem código e notebooks de treino; não há artefato treinado. Se for treinado depois, entra como exploratório."
